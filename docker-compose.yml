version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resort_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./resort.db
      - CORS_ORIGINS=["http://localhost:5173", "http://localhost:80"]
    volumes:
      - backend_data:/app/data
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resort_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always

volumes:
  backend_data:
